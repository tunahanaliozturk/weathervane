name: bench

# Propagation latency on a GitHub-hosted runner, so the number comes from hardware anyone can rent.
on:
  workflow_dispatch:
    inputs:
      streams:
        description: Open streams
        default: "10000"
      flips:
        description: Flag changes to time
        default: "20"

permissions:
  contents: read

jobs:
  propagation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: weathervane
          POSTGRES_PASSWORD: weathervane
          POSTGRES_DB: weathervane
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U weathervane" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://weathervane:weathervane@127.0.0.1:5432/weathervane
      WEATHERVANE_ROOT_KEY: bench-root-key-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the server
        run: |
          PORT=8080 HOST=127.0.0.1 LOG_LEVEL=warn node packages/server/dist/main.js &
          for i in $(seq 30); do node -e "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))" && break; sleep 1; done
      - name: Measure
        # Explicit bash turns on pipefail, so a failing benchmark is not hidden by tee.
        shell: bash
        run: |
          ulimit -n 65536
          lscpu | grep -E 'Model name|^CPU\(s\)' | tee -a "$GITHUB_STEP_SUMMARY"
          node bench/propagation.ts --base-url http://127.0.0.1:8080 \
            --streams "${{ inputs.streams }}" --workers 4 --flips "${{ inputs.flips }}" | tee result.json
          { echo '```json'; cat result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
